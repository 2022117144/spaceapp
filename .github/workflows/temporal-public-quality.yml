name: Temporal candidate public quality
run-name: Public quality for ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable candidate commit to validate
        required: true
        default: 3ba895e1581c4afd9310c85fee7a24a062014c9f
        type: string

permissions:
  contents: read

concurrency:
  group: temporal-public-quality-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  public-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Validate candidate reference
        shell: bash
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Record exact candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          printf 'Candidate: `%s`\n\n' "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          node --version
          npm --version
      - name: Create sanitized public candidate
        run: node scripts/public-export.mjs --output "$RUNNER_TEMP/spaceapp-public-export"
      - name: Install public suite prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ffmpeg
      - name: Install locked candidate dependencies
        id: install
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm ci --no-audit --no-fund
      - name: Public tests including all worker tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run test:public
      - name: Repository typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run check
      - name: Full production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run build
      - name: Launcher package dry-run
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run pack:dry-run -w run-spaceapp
